# Offline tests and the secret scan on every push (docs/spec/05-security.md section 4, rule 5).
# No rfab key here, ever: nothing in CI makes a paid call. Third-party actions are pinned by commit SHA.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Offline tests
        run: ./gradlew check --console=plain
      - name: Secret scan tests
        run: sh scripts/test-check-secrets
      - name: Secret scan
        run: sh scripts/check-secrets
